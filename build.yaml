name: Build ZMK Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build ZMK Firmware ({{ matrix.shield }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shield: [cck_ball_left, cck_ball_right]  # ← 빌드할 쉴드 종류
        board: [nice_nano_v2]                    # ← 보드 종류 (nice_nano_v2)
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install west
        run: |
          pip install --upgrade pip
          pip install west

      - name: Initialize Zephyr
        run: west init -l .

      - name: Update Zephyr modules
        run: west update

      - name: Build ZMK
        run: |
          west build -s zmk/app \
                     -d build/${{ matrix.shield }} \
                     -b ${{ matrix.board }} \
                     -- -DZMK_CONFIG=./config \
                        -DSHIELD=${{ matrix.shield }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v3
        with:
          name: zmk-firmware-${{ matrix.shield }}
          path: build/${{ matrix.shield }}/zephyr/zmk.uf2
