name: Build ZMK Firmware

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build ZMK Firmware ({{ matrix.shield }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        shield: [left, right]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install west
        run: |
          python -m pip install --upgrade pip
          pip install west cmake ninja

      - name: Initialize Zephyr
        run: west init -l .
      
      - name: Update Zephyr modules
        run: west update

      - name: Build ZMK Firmware
        run: |
          west build -s zmk/app \
                     -b nice_nano \
                     -d /tmp/build-${{ matrix.shield }} \
                     -- -DZMK_CONFIG=$GITHUB_WORKSPACE/config \
                        -DSHIELD=cck_ball_${{ matrix.shield }}
